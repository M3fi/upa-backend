name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: upa_test
          POSTGRES_USER: upa
          POSTGRES_PASSWORD: upa_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready -U upa
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USERNAME: upa
          DB_PASSWORD: upa_test
          DB_DATABASE: upa_test
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_SECRET: ci-secret-at-least-16-chars!!
          NODE_ENV: test

      - name: Run tests
        run: npm test
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USERNAME: upa
          DB_PASSWORD: upa_test
          DB_DATABASE: upa_test
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_SECRET: ci-secret-at-least-16-chars!!
          NODE_ENV: test
